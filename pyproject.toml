[project]
name = "jobhq"
version = "1.0.0"
description = "JobHQ: Local-first personal job tracker & application hub with IMAP sync, background worker daemon, and optional local AI parsing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.0",
    "llama-cpp-python>=0.3.16",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.0.0",
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
